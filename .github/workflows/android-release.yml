name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - run: pnpm install --frozen-lockfile

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/google-services.json

      - name: Set release version
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e 'const fs=require("fs"); const p="apps/mobile/app.json"; const c=JSON.parse(fs.readFileSync(p,"utf8")); const v=process.env.GITHUB_REF_NAME.slice(1); if(!/^\d+\.\d+\.\d+$/.test(v)) throw new Error("Tag must match vMAJOR.MINOR.PATCH"); c.expo.version=v; c.expo.android.versionCode=Number(process.env.VERSION_CODE); fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          pnpm --filter mobile exec expo prebuild --platform android --no-install --clean

      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/pk-planner-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          GRADLE_PROPERTIES=apps/mobile/android/gradle.properties
          printf '\nMYAPP_UPLOAD_STORE_FILE=%s\n' "$KEYSTORE_PATH" >> "$GRADLE_PROPERTIES"
          printf 'MYAPP_UPLOAD_STORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GRADLE_PROPERTIES"
          printf 'MYAPP_UPLOAD_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS" >> "$GRADLE_PROPERTIES"
          printf 'MYAPP_UPLOAD_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD" >> "$GRADLE_PROPERTIES"

      - name: Build signed APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Prepare release notes
        run: node -e 'const fs = require("node:fs"); const notes = JSON.parse(fs.readFileSync("apps/mobile/release-notes.json", "utf8")); if (notes.version !== process.env.GITHUB_REF_NAME.slice(1)) throw new Error("Release notes version does not match tag"); fs.writeFileSync("apps/mobile/release-body.md", notes.changelog + "\n")'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: PK Planner ${{ github.ref_name }}
          body_path: apps/mobile/release-body.md
          generate_release_notes: false
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
