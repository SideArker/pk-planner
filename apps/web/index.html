<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PK Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090a0d" />
    <script>
      (function () {
        var newOrigin = 'https://pkplanner.sidearker.com';
        var hostname = window.location.hostname;
        var allowedKeys = [
          'pk_planner_user_config',
          'pk_planner_theme',
          'pk_planner_desktop_layout',
        ];

        try {
          var migrationPrefix = '#storage-migration=';
          if (hostname === 'pkplanner.sidearker.com' && window.location.hash.indexOf(migrationPrefix) === 0) {
            var payload = window.location.hash.slice(migrationPrefix.length);
            var data = JSON.parse(decodeURIComponent(payload));
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
              throw new Error('Invalid storage migration payload');
            }
            if (!localStorage.getItem('pk_planner_storage_migrated')) {
              allowedKeys.forEach(function (key) {
                if (typeof data[key] === 'string') {
                  localStorage.setItem(key, data[key]);
                }
              });
              localStorage.setItem('pk_planner_storage_migrated', '1');
            }

            window.history.replaceState(
              null,
              '',
              window.location.pathname + window.location.search
            );
          }

          if (hostname === 'pk-planner.rsowa126.workers.dev') {
            var storage = {};
            allowedKeys.forEach(function (key) {
              try {
                storage[key] = localStorage.getItem(key);
              } catch (_) {
                storage[key] = null;
              }
            });
            var encoded = encodeURIComponent(JSON.stringify(storage));
            window.location.replace(
              newOrigin + window.location.pathname + window.location.search +
              migrationPrefix + encoded
            );
            return;
          }
        } catch (err) {
          console.error('Storage migration failed', err);
        }

        try {
          var saved = localStorage.getItem('pk_planner_theme');
          var isDark =
            saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
