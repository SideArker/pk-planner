<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Book Cover Gradient (Matte Dark Zinc Leather) -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24242c" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>

    <!-- Subtle Ambient Drop Shadow -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- White icon canvas -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Book Container with Shadow -->
  <g filter="url(#bookShadow)">
    <!-- Stacked Pages (Fore-edge on Right) -->
    <rect x="390" y="80" width="16" height="344" rx="4" fill="#26262e" />
    <line x1="392" y1="95" x2="404" y2="95" stroke="#383844" stroke-width="1.5" />
    <line x1="392" y1="145" x2="404" y2="145" stroke="#383844" stroke-width="1.5" />
    <line x1="392" y1="205" x2="404" y2="205" stroke="#383844" stroke-width="1.5" />
    <line x1="392" y1="275" x2="404" y2="275" stroke="#383844" stroke-width="1.5" />
    <line x1="392" y1="345" x2="404" y2="345" stroke="#383844" stroke-width="1.5" />
    <line x1="392" y1="405" x2="404" y2="405" stroke="#383844" stroke-width="1.5" />

    <!-- Hardcover Body -->
    <rect x="96" y="70" width="300" height="364" rx="20" fill="url(#coverGrad)" stroke="#3a3a46" stroke-width="1" />

    <!-- Spine Hinge & Crease -->
    <line x1="134" y1="72" x2="134" y2="432" stroke="#08080a" stroke-width="2.5" />
    <line x1="136" y1="72" x2="136" y2="432" stroke="#444452" stroke-width="1" stroke-opacity="0.6" />

    <!-- Spine Ribs / Stitches -->
    <line x1="102" y1="126" x2="131" y2="126" stroke="#484856" stroke-width="2" />
    <line x1="102" y1="206" x2="131" y2="206" stroke="#484856" stroke-width="2" />
    <line x1="102" y1="296" x2="131" y2="296" stroke="#484856" stroke-width="2" />
    <line x1="102" y1="376" x2="131" y2="376" stroke="#484856" stroke-width="2" />

