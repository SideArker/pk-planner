<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>

    <!-- Glass Fill Gradient -->
    <linearGradient id="glassGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Cyan Edge -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- Inner Grid Pattern -->
    <linearGradient id="gridLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle ambient inner glow / border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3" />

  <!-- Monogram Graphic with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Base Shape Group -->
    <!-- 'P' Vertical Stem -->
    <rect x="116" y="140" width="54" height="232" rx="12" fill="url(#glassGrad)" stroke="url(#edgeGlow)" stroke-width="6" />

    <!-- 'P' Calendar Blocks Horizontal Dividers -->
    <line x1="120" y1="198" x2="166" y2="198" stroke="url(#gridLineGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="256" x2="166" y2="256" stroke="url(#gridLineGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="314" x2="166" y2="314" stroke="url(#gridLineGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- 'P' Loop -->
    <path d="M 166 140 H 236 C 274 140 302 166 302 204 C 302 242 274 268 236 268 H 166" 
          fill="none" 
          stroke="url(#glassGrad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 166 140 H 236 C 274 140 302 166 302 204 C 302 242 274 268 236 268 H 166" 
          fill="none" 
          stroke="url(#edgeGlow)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'P' Loop Timetable Segments -->
    <line x1="225" y1="144" x2="225" y2="186" stroke="url(#gridLineGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="225" y1="222" x2="225" y2="264" stroke="url(#gridLineGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- 'K' Vertical Joint / Lower Stem -->
    <rect x="242" y="278" width="48" height="94" rx="10" fill="url(#glassGrad)" stroke="url(#edgeGlow)" stroke-width="6" />
    <line x1="246" y1="325" x2="286" y2="325" stroke="url(#gridLineGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- 'K' Upper Diagonal Arm -->
    <line x1="270" y1="280" x2="386" y2="148" 
          stroke="url(#glassGrad)" 
          stroke-width="48" 
          stroke-linecap="round" />
    <line x1="270" y1="280" x2="386" y2="148" 
          stroke="url(#edgeGlow)" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- 'K' Lower Diagonal Arm -->
    <line x1="276" y1="284" x2="390" y2="368" 
          stroke="url(#glassGrad)" 
          stroke-width="48" 
          stroke-linecap="round" />
    <line x1="276" y1="284" x2="390" y2="368" 
          stroke="url(#edgeGlow)" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Subtle Schedule Grid Indicators in K arms -->
    <circle cx="330" cy="212" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="334" cy="326" r="4" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
